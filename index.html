<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>ანანოსთვის ❤️</title>
                <style>
                        /* ფონი და ძირითადი სტილი */
                                body {
                                            margin: 0; padding: 0; display: flex; justify-content: center; align-items: center;
                                                        height: 100vh; background-color: #fdfaf0; font-family: 'Helvetica Neue', sans-serif;
                                                                    overflow: hidden; position: relative;
                                                                            }

                                                                                    /* მოფრინავე ბუშტები */
                                                                                            @keyframes balloonUp {
                                                                                                        0% { transform: translateY(110vh); opacity: 1; }
                                                                                                                    100% { transform: translateY(-110vh); opacity: 0; }
                                                                                                                            }
                                                                                                                                    .balloon {
                                                                                                                                                position: absolute; bottom: -100px; width: 35px; height: 45px;
                                                                                                                                                            border-radius: 50%; opacity: 0.5; animation: balloonUp 10s linear infinite;
                                                                                                                                                                    }

                                                                                                                                                                            /* საყვარელი დათუნია */
                                                                                                                                                                                    .bear {
                                                                                                                                                                                                position: absolute; bottom: 20px; right: 20px; width: 140px; z-index: 5;
                                                                                                                                                                                                        }

                                                                                                                                                                                                                /* შავ-ოქროსფერი კონვერტი */
                                                                                                                                                                                                                        .envelope-wrapper {
                                                                                                                                                                                                                                    position: absolute; bottom: 60px; left: 40px; cursor: pointer; z-index: 10;
                                                                                                                                                                                                                                                transition: transform 0.3s ease;
                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                .envelope-wrapper:hover { transform: scale(1.1); }
                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                .envelope {
                                                                                                                                                                                                                                                                                            width: 120px; height: 80px; background-color: #1a1a1a;
                                                                                                                                                                                                                                                                                                        border: 2px solid #d4af37; border-radius: 8px; position: relative;
                                                                                                                                                                                                                                                                                                                    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                    .envelope::before {
                                                                                                                                                                                                                                                                                                                                                content: ''; position: absolute; top: 0; left: 0; width: 0; height: 0;
                                                                                                                                                                                                                                                                                                                                                            border-left: 60px solid transparent; border-right: 60px solid transparent;
                                                                                                                                                                                                                                                                                                                                                                        border-top: 50px solid #d4af37;
                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                        .seal {
                                                                                                                                                                                                                                                                                                                                                                                                    position: absolute; top: 35px; left: 50px; width: 22px; height: 22px;
                                                                                                                                                                                                                                                                                                                                                                                                                background-color: #b30000; border-radius: 50%; border: 1px solid #800000;
                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                /* მილოცვის ბარათი */
                                                                                                                                                                                                                                                                                                                                                                                                                                        .card {
                                                                                                                                                                                                                                                                                                                                                                                                                                                    display: none; position: absolute; top: 45%; left: 50%;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                transform: translate(-50%, -50%); background: white; padding: 40px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            border-radius: 25px; box-shadow: 0 25px 60px rgba(0,0,0,0.15);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        text-align: center; width: 80%; max-width: 350px; z-index: 100;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    border: 2px solid #fdfaf0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    .card.show { display: block; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    @keyframes popIn {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    h2 { color: #d4af37; font-size: 1.8rem; margin-bottom: 15px; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            p { color: #444; font-size: 1.2rem; line-height: 1.6; margin: 0; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </head>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <body>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <img src="https://i.ibb.co/3WfK9Fj/bear.png" alt="Bear" class="bear">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="envelope-wrapper" onclick="openMessage()">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="envelope">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="seal"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="card" id="birthdayCard">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <h2>🎉 გილოცავ! 🎂</h2>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <p>ანანო, დაბადების დღეს გილოცავ! ღმერთმა ჯანმრთელად და ბედნიერად გამყოფოს მუდამ. ✨❤️</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            // ფერადი ბუშტების შექმნა
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const colors = ['#ff9a9e', '#fad0c4', '#a6c1ee', '#fbc2eb', '#fff1eb'];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const body = document.body;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    for (let i = 0; i < 30; i++) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let balloon = document.createElement('div');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            balloon.className = 'balloon';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        balloon.style.left = Math.random() * 100 + 'vw';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    balloon.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                balloon.style.animationDelay = Math.random() * 8 + 's';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            balloon.style.width = (Math.random() * 20 + 20) + 'px';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        body.appendChild(balloon);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        // ფუნქცია, რომელიც აჩვენებს ბარათს
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                function openMessage() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById('birthdayCard').classList.add('show');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </html>
